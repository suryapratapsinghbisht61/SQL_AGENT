<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Analyst</title>
<style>
  :root { --bg:#f7f7f8; --panel:#fff; --text:#1d1d1f; --muted:#6b6b76; --border:#e3e3e8; --accent:#2f6fed; --user:#2f6fed; --userText:#fff; --err:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141417; --panel:#1e1e23; --text:#ececf1; --muted:#9a9aa6; --border:#2e2e36; --accent:#6b9bff; --user:#3a5fc8; --userText:#fff; --err:#ff7b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { margin:0; font-size:16px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:900px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:var(--user); color:var(--userText); }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--border); width:85%; }
  .bot.error { border-color:var(--err); }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--accent); font-size:13px; }
  pre { background:var(--bg); padding:8px; border-radius:6px; overflow-x:auto; font-size:13px; white-space:pre-wrap; }
  .table-wrap { overflow-x:auto; max-height:300px; margin-top:6px; }
  table { border-collapse:collapse; font-size:13px; white-space:nowrap; }
  th, td { border:1px solid var(--border); padding:4px 8px; text-align:left; }
  th { background:var(--bg); position:sticky; top:0; }
  .examples { display:flex; flex-wrap:wrap; gap:8px; }
  .examples button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:16px; padding:6px 12px; cursor:pointer; font:inherit; font-size:13px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); background:var(--panel); max-width:900px; width:100%; margin:0 auto; }
  input { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  form button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1>SQL Analyst</h1>
  <p>Ask a question about the Chinook music store database. Answers come from real query results.</p>
</header>
<main id="log" aria-live="polite">
  <div class="msg bot">Try one of these, or type your own:
    <div class="examples">
      <button type="button">Which 5 artists have the most tracks?</button>
      <button type="button">What were total sales per country? Top 5 only.</button>
      <button type="button">Which employee supports the most customers?</button>
      <button type="button">Which genre has the longest average track length?</button>
    </div>
  </div>
</main>
<form id="form">
  <label for="q" hidden>Question</label>
  <input id="q" maxlength="500" placeholder="Ask a question…" autocomplete="off" required>
  <button id="send">Ask</button>
</form>
<script>
const log = document.getElementById("log"), form = document.getElementById("form"),
      input = document.getElementById("q"), send = document.getElementById("send");

function el(tag, props = {}, ...children) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...children);
  return n;
}

function add(node) { log.append(node); log.scrollTop = log.scrollHeight; return node; }

function rowsTable(rows) {
  const cols = Object.keys(rows[0]);
  return el("div", { className: "table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, ...cols.map(c => el("th", { textContent: c })))),
    el("tbody", {}, ...rows.map(r => el("tr", {}, ...cols.map(c => el("td", { textContent: r[c] ?? "NULL" })))))));
}

async function ask(question) {
  add(el("div", { className: "msg user", textContent: question }));
  const pending = add(el("div", { className: "msg bot", textContent: "Thinking… (free-tier rate limits can make this take 10–30 s)" }));
  send.disabled = true;
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    const data = await res.json();
    pending.textContent = "";
    if (!res.ok) {
      pending.classList.add("error");
      const d = data.detail;
      pending.textContent = "Error: " + (Array.isArray(d) ? d.map(e => e.msg).join("; ") : d);
      return;
    }
    if (data.error) pending.classList.add("error");
    pending.append(data.answer);
    if (data.sql) pending.append(el("details", {}, el("summary", { textContent: "SQL" }), el("pre", { textContent: data.sql })));
    if (data.rows.length) pending.append(el("details", {}, el("summary", { textContent: `Rows (${data.rows.length})` }), rowsTable(data.rows)));
    pending.append(el("div", { className: "meta", textContent: `attempts: ${data.attempts}` }));
  } catch (e) {
    pending.classList.add("error");
    pending.textContent = "Could not reach the server: " + e.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || send.disabled) return;
  input.value = "";
  ask(q);
});
log.querySelectorAll(".examples button").forEach(b => b.addEventListener("click", () => { if (!send.disabled) ask(b.textContent); }));
</script>
</body>
</html>
